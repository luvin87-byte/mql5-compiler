name: MQL5 Auto Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile mt5setup.exe
          New-Item -ItemType Directory -Force -Path C:\MT5 | Out-Null
          Start-Process -FilePath .\mt5setup.exe -ArgumentList '/auto','/path:"C:\MT5"' -Wait -NoNewWindow
          Get-ChildItem -Recurse C:\MT5 -Filter metaeditor64.exe | Select-Object -ExpandProperty FullName

      - name: Compile MQL5
        uses: fx31337/mql-compile-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: 'SENTINEL1_26.mq5'
          init-platform: true
          mt-path: 'C:\MT5'
          verbose: true

      - name: Upload EX5 Binary
        uses: actions/upload-artifact@v4
        with:
          name: Compiled_EA
          path: '**/*.ex5'
          if-no-files-found: error
