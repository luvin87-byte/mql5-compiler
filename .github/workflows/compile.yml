name: MQL5 Auto Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download MetaEditor Engine
        shell: pwsh
        run: |
          # Download a portable lightweight compiler toolkit package
          $zipUrl = "https://github.com/fx31337/mql-compile-action/releases/download/v2.0.0/metaeditor.zip"
          # Alternatively, we can download a verified standalone archive or use direct extraction.
          # Let's use a direct reliable mirror or set up the compiler directory:
          New-Item -ItemType Directory -Force -Path C:\MT5 | Out-Null
          
          # Since the web installer fails, let's download a direct portable build or use curl to fetch metaeditor components
          Write-Host "Setting up compilation directory..."

      - name: Direct MetaEditor Compile
        shell: pwsh
        run: |
          $src = "SENTINEL1_26.mq5"
          if (-not (Test-Path $src)) {
              throw "Source file $src not found in repository root!"
          }
          
          # Let's search if metaeditor exists anywhere on the runner or download a direct archive
          $editor = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\MT5" -Recurse -Filter "metaeditor64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $editor) {
              Write-Host "MetaEditor not found locally. Downloading portable package..."
              $compilerZip = "$env:RUNNER_TEMP\metaeditor.zip"
              
              # Fallback: Download a direct community-hosted portable metaeditor archive
              $portableUrl = "https://github.com/fx31337/mql-compile-action/raw/main/bin/metaeditor64.exe"
              # Let's use curl to fetch the compiler binary directly if available, or download via official channels
          }
