name: MQL5 Auto Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile MQL5
        uses: fx31337/mql-compile-action@master
        with:
          include: '.'

      - name: Upload EX5 Binary
        uses: actions/upload-artifact@v4
        with:
          name: Compiled_EA
          path: '**/*.ex5'
