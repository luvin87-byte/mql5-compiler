name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download MetaEditor Engine
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $output = "mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "MetaEditor not found locally. Downloading portable package..."
          Start-Process -FilePath $output -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 87
          echo "MT_PATH=C:\Program Files\MetaTrader 5" >> $env:GITHUB_ENV

      - name: Direct MetaEditor Compile
        shell: pwsh
        run: |
          $src = "SENTINEL1_26.mq5"
          $root = $env:MT_PATH
          if (-not $root) {
              $root = "C:\Program Files\MetaTrader 5"
          }
          $mte = Join-Path $root 'metaeditor64.exe'
          if (-not (Test-Path $mte)) { throw "Compiler missing: $mte" }

          if (-not (Test-Path $src)) { throw "Cannot find $src" }

          $trade = Get-ChildItem -Path $root, "$env:APPDATA\MetaQuotes" -Recurse -Filter 'Trade.mqh' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $trade) { throw "Standard library not found (Trade.mqh)" }

          $inc = $trade.Directory.Parent.Parent.FullName
          Write-Host "Trade.mqh: $($trade.FullName)"
          Write-Host "Using include dir: $inc"

          $log = Join-Path $pwd 'mql.log'
          $cmd = '"{0}" /compile:"{1}" /inc:"{2}" /log:"{3}"' -f $mte, (Join-Path $pwd $src), $inc, $log
          Write-Host "Running: $cmd"
          cmd /c $cmd
          Write-Host "metaeditor exit: $LASTEXITCODE"

          if (Test-Path $log) {
            Write-Host "===== compile log ====="
            Get-Content $log -Encoding Unicode
          }

          $ex5 = [IO.Path]::ChangeExtension((Join-Path $pwd $src), '.ex5')
          if (-not (Test-Path $ex5)) { throw "Compile failed: no .ex5 produced" }
          Write-Host ('Built {0} ({1} bytes)' -f $ex5, (Get-Item $ex5).Length)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL1_26
          path: SENTINEL1_26.ex5
