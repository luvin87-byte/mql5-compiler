name: MQL5 Auto Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          curl.exe -L --fail -o $setup "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $len = (Get-Item $setup).Length
          Write-Host "Installer size: $len bytes"
          if ($len -lt 100000) { throw "Bad installer download ($len bytes)" }

          New-Item -ItemType Directory -Force -Path C:\MT5 | Out-Null
          $p = Start-Process -FilePath $setup -ArgumentList '/auto','/path:C:\MT5' -PassThru
          Write-Host "Stub PID $($p.Id)"

          $deadline = (Get-Date).AddMinutes(10)
          $editor = $null
          while ((Get-Date) -lt $deadline) {
            $editor = Get-ChildItem -Path C:\MT5,'C:\Program Files','C:\Program Files (x86)' `
              -Recurse -Filter metaeditor64.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($editor) { break }
            if ($p.HasExited) { Write-Host "Stub exited $($p.ExitCode). Waiting for files..." }
            else { Write-Host "Stub still running..." }
            Start-Sleep -Seconds 15
          }

          if (-not $editor) { throw "metaeditor64.exe not found after 10 minutes" }

          $root = $editor.Directory.FullName
          Write-Host "FOUND $($editor.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "MT_PATH=$root" -Encoding utf8

      - name: Compile MQL5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MT_PATH
          $mte  = Join-Path $root 'metaeditor64.exe'
          Write-Host "MT_PATH=$root"
          if (-not (Test-Path $mte)) { throw "Compiler missing: $mte" }

          $src = Join-Path $pwd 'SENTINEL1_26.mq5'
          if (-not (Test-Path $src)) { throw "Cannot find $src" }

          # Standard library lives in MQL5 next to the terminal (portable) or in AppData
          $trade = Get-ChildItem -Path $root, "$env:APPDATA\MetaQuotes" `
            -Recurse -Filter 'Trade.mqh' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $trade) {
            Write-Host "Trade.mqh missing — launching terminal once to unpack includes"
            $term = Join-Path $root 'terminal64.exe'
            if (Test-Path $term) {
              $tp = Start-Process -FilePath $term -ArgumentList '/portable' -PassThru
              Start-Sleep -Seconds 25
              if (-not $tp.HasExited) { Stop-Process -Id $tp.Id -Force -ErrorAction SilentlyContinue }
            }
            $trade = Get-ChildItem -Path $root, "$env:APPDATA\MetaQuotes" `
              -Recurse -Filter 'Trade.mqh' -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $trade) { throw "Standard library not found (Trade.mqh). EA cannot compile." }

          # /inc must be the MQL5 folder (parent of Include)
          $inc = $trade.Directory.Parent.FullName
          Write-Host "Using include dir: $inc"

          $log = Join-Path $pwd 'mql.log'
          $cmd = "`"$mte`" /compile:`"$src`" /inc:`"$inc`" /log:`"$log`""
          Write-Host "Running: $cmd"
          cmd /c $cmd
          Write-Host "metaeditor exit: $LASTEXITCODE"

          if (Test-Path $log) {
            Write-Host "===== compile log ====="
            Get-Content $log -Encoding Unicode
          } else {
            Write-Host "No mql.log was written"
          }

          $ex5 = [IO.Path]::ChangeExtension($src, '.ex5')
          if (-not (Test-Path $ex5)) { throw "Compile failed: no .ex5 produced" }
          Write-Host "Built \( ex5 ( \)((Get-Item $ex5).Length) bytes)"

      - name: Upload EX5 Binary
        uses: actions/upload-artifact@v4
        with:
          name: Compiled_EA
          path: '**/*.ex5'
          if-no-files-found: error
